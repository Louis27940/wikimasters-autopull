<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 270px; margin: 0; padding: 14px; background: #141414; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 12px; color: #3ddc97; }
  label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .checkbox-label { justify-content: flex-start; gap: 8px; }
  input[type=number] { width: 55px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; }
  button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #3ddc97; color: #0b0b0b; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .info { margin-top: 12px; font-size: 12px; color: #aaa; line-height: 1.5; border-top: 1px solid #282828; padding-top: 8px; }
  .status-badge { font-weight: 500; }
  .status-running { color: #f59e0b; }
</style>
</head>
<body>
  <h1>WikiMasters Auto-Pull</h1>
  <label class="checkbox-label"><input type="checkbox" id="enabled"> Activé</label>
  <label>Toutes les <input type="number" id="periodMin" min="1" max="1440"> min</label>
  <label>Max paquets par cycle <input type="number" id="maxPacks" min="1" max="50"></label>
  <label class="checkbox-label"><input type="checkbox" id="background"> Onglet en arrière-plan</label>
  <label class="checkbox-label"><input type="checkbox" id="notify"> Notification après chaque cycle</label>
  <button id="run">Ouvrir maintenant</button>
  <div class="info">
    <div>Dernier cycle : <span id="lastRun">—</span></div>
    <div>Résultat : <span id="lastStatus" class="status-badge">—</span></div>
    <div>Prochain : <span id="next">—</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
