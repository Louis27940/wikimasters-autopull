<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; background: #141414; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 12px; color: #3ddc97; }
  label { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .checkbox-label { justify-content: flex-start; gap: 8px; }
  input[type=number] { width: 55px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; transition: border-color 0.2s, box-shadow 0.2s; }
  input[type=number]:focus { outline: none; border-color: #3ddc97; }
  input[type=number].input-invalid { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444; }
  
  .btn-action { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #3ddc97; color: #0b0b0b; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s; }
  .btn-action:hover { opacity: 0.9; }
  .btn-stop { background: #ef4444; color: #fff; }
  
  /* Bannière d'avertissement sans émoji */
  .auth-banner { display: none; margin-bottom: 12px; padding: 8px 10px; background: #2a1f0a; border: 1px solid #f59e0b; border-radius: 6px; color: #fbbf24; font-size: 12px; }
  .auth-banner p { margin: 0 0 6px 0; }
  .auth-banner button { background: #f59e0b; color: #111; border: 0; padding: 4px 8px; border-radius: 4px; font-weight: 600; cursor: pointer; }

  .info { margin-top: 12px; font-size: 12px; color: #aaa; line-height: 1.5; border-top: 1px solid #282828; padding-top: 8px; }
  .status-badge { font-weight: 500; }
  .status-success { color: #3ddc97; }
  .status-warning { color: #f59e0b; }
  .status-error { color: #ef4444; }
  
  /* Animation CSS de pulsation pour l'état en cours */
  .status-running { color: #38bdf8; display: inline-flex; align-items: center; gap: 6px; }
  .spinner { display: inline-block; width: 8px; height: 8px; border: 2px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>WikiMasters Auto-Pull</h1>

  <div id="authBanner" class="auth-banner">
    <p>Session expirée ou non connecté.</p>
    <button id="loginBtn">Se connecter</button>
  </div>

  <label class="checkbox-label"><input type="checkbox" id="enabled"> Activé</label>
  <label>Toutes les <input type="number" id="periodMin" min="1" max="1440"> min</label>
  <label>Max paquets par cycle <input type="number" id="maxPacks" min="1" max="10"></label>
  <label class="checkbox-label"><input type="checkbox" id="background"> Onglet en arrière-plan</label>
  <label class="checkbox-label"><input type="checkbox" id="notify"> Notification après chaque cycle</label>
  
  <button id="run" class="btn-action">Ouvrir maintenant</button>
  
  <div class="info">
    <div>Dernier cycle : <span id="lastRun">—</span></div>
    <div>Résultat : <span id="lastStatus" class="status-badge">—</span></div>
    <div>Prochain : <span id="next">—</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
