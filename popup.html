<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; background: #141414; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 12px; color: #3ddc97; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  input[type=number] { width: 60px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px; }
  button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #3ddc97; color: #0b0b0b; font-weight: 600; cursor: pointer; }
  .info { margin-top: 12px; font-size: 12px; color: #aaa; line-height: 1.5; }
</style>
</head>
<body>
  <h1>WikiMasters Auto-Pull</h1>
  <label><input type="checkbox" id="enabled"> Activé</label>
  <label>Toutes les <input type="number" id="periodMin" min="1"> minutes</label>
  <label><input type="checkbox" id="background"> Onglet en arrière-plan</label>
  <label><input type="checkbox" id="notify"> Notification après chaque cycle</label>
  <button id="run">Ouvrir maintenant</button>
  <div class="info">
    <div>Dernier cycle : <span id="lastRun">—</span></div>
    <div>Résultat : <span id="lastStatus">—</span></div>
    <div>Prochain : <span id="next">—</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
